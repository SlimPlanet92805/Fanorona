<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pieceShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="targetGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00e676" flood-opacity="0.9"/>
    </filter>
    <marker id="arrowhead" markerWidth="6" markerHeight="4.2" refX="5.4" refY="2.1" orient="auto">
      <polygon points="0 0, 6 2.1, 0 4.2" fill="#00e676"/>
    </marker>
  </defs>

  <rect width="200" height="200" rx="28" fill="#1a1a1a"/>
  <g stroke="#444" stroke-width="3">
    <line x1="40" y1="40" x2="160" y2="40"/>
    <line x1="40" y1="100" x2="160" y2="100"/>
    <line x1="40" y1="160" x2="160" y2="160"/>
    <line x1="40" y1="40" x2="40" y2="160"/>
    <line x1="100" y1="40" x2="100" y2="160"/>
    <line x1="160" y1="40" x2="160" y2="160"/>
    <line x1="40" y1="40" x2="160" y2="160"/>
    <line x1="160" y1="40" x2="40" y2="160"/>
  </g>

  <!-- other pieces: dark fill + matching dark border (.p2), plus the drop
       shadow every .piece gets (0 4px 6px rgba(0,0,0,.4)), which is what
       actually reads as their "darker edge" against the board -->
  <g filter="url(#pieceShadow)">
    <circle cx="40" cy="40" r="15" fill="#111" stroke="#000" stroke-width="1.2"/>
    <circle cx="160" cy="40" r="15" fill="#111" stroke="#000" stroke-width="1.2"/>
    <circle cx="40" cy="100" r="15" fill="#111" stroke="#000" stroke-width="1.2"/>
    <circle cx="40" cy="160" r="15" fill="#111" stroke="#000" stroke-width="1.2"/>
    <circle cx="160" cy="160" r="15" fill="#111" stroke="#000" stroke-width="1.2"/>
  </g>

  <!-- that square is now empty: just the hollow trajectory marker (.traj-circle),
       smaller than a piece -->
  <circle cx="100" cy="40" r="9" fill="#00e676" fill-opacity="0.1" stroke="#00e676" stroke-width="1.5"/>

  <!-- trajectory trail: dashed in the open gap, then a short solid tail
       tucked under the selected piece so a sliver stays visible at its edge
       exactly like the real UI (the piece is painted on top and masks the
       rest, including almost all of the arrowhead) -->
  <line x1="100" y1="45" x2="100" y2="74" stroke="#00e676" stroke-width="2.4" stroke-dasharray="7 8"/>
  <line x1="100" y1="74" x2="100" y2="90" stroke="#00e676" stroke-width="2.4" marker-end="url(#arrowhead)"/>

  <!-- the selected piece, mid-combo: scaled up (real UI: transform: scale(1.2))
       with a solid blue ring outside it (.selected box-shadow), a normal
       .p1 gray border, and the same drop shadow as every other piece -->
  <g filter="url(#pieceShadow)">
    <circle cx="100" cy="100" r="20.4" fill="#2196f3"/>
    <circle cx="100" cy="100" r="18" fill="#e0e0e0" stroke="#999" stroke-width="1.2"/>
  </g>

  <!-- an available next-step target: smaller than a piece, translucent, glowing (.target) -->
  <circle cx="160" cy="100" r="7" fill="#00e676" fill-opacity="0.8" filter="url(#targetGlow)"/>
</svg>
