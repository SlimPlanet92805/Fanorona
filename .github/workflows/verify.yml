# Runs the Java/C++ equivalence check on every push.
#
# The C++ engine is the one that ships; the Java implementation is kept as the
# reference that proves it still plays the same game. That guarantee is only
# worth anything if something actually checks it, so this is the gate.
name: Verify engine parity

on:
  push:
    branches: [master]
    paths:
      - 'engine/**'
      - 'src/main/java/**'
      - 'bench/**'
      - 'scripts/check-parity.py'
      - '.github/workflows/verify.yml'
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Compare the C++ engine against the Java reference
        # Depths 4 and 6 keep CI quick; the deep score-agreement check still
        # exercises the path where the fixed-size table starts evicting.
        run: python3 scripts/check-parity.py --depths 4,6 --score-depths 8
